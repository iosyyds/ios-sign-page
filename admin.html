<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 - 轻松签</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body class="bg-slate-50 text-gray-800 min-h-screen">

<div id="loginWrap" class="flex items-center justify-center min-h-screen px-4">
  <div class="bg-white rounded-3xl shadow-xl shadow-gray-200/50 p-8 md:p-10 w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-400 to-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/30 mx-auto mb-4">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
      </div>
      <h1 class="font-semibold text-2xl md:text-3xl text-gray-800 mb-2">轻松签</h1>
      <p class="text-sm text-gray-500">管理后台登录</p>
    </div>
    <input type="password" id="passwordInput" placeholder="请输入管理员密码" class="w-full px-5 py-3.5 bg-gray-50 border-0 rounded-2xl focus:ring-2 focus:ring-indigo-500/50 focus:bg-white transition-all duration-200 text-sm mb-5" onkeypress="if(event.key==='Enter')login()">
    <button onclick="login()" class="w-full px-6 py-3.5 rounded-2xl font-medium shadow-lg hover:-translate-y-0.5 hover:shadow-xl transition-all duration-200 bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 text-sm active:scale-95">登 录</button>
  </div>
</div>

<div id="adminLayout" class="hidden">
  <nav class="bg-white/80 backdrop-blur-sm border-0 border-transparent px-4 md:px-6 lg:px-8 py-4 sticky top-0 z-50 shadow-sm">
    <div class="flex items-center justify-between max-w-6xl mx-auto gap-6">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-indigo-400 to-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        </div>
        <span class="font-semibold text-xl text-gray-800">管理后台</span>
      </div>
      <div class="flex items-center gap-4">
        <a href="/" class="text-sm text-gray-500 hover:text-indigo-600 transition-colors hidden md:inline">返回前台</a>
        <button onclick="logout()" class="px-4 py-2 rounded-xl text-sm text-gray-600 bg-gray-100 hover:bg-gray-200 transition-colors">退出登录</button>
      </div>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto px-4 md:px-6 lg:px-8 py-8 md:py-12">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 mb-8">
      <div class="bg-white rounded-3xl shadow-xl shadow-gray-200/50 p-5 md:p-6">
        <div class="w-10 h-10 rounded-full bg-indigo-500/10 flex items-center justify-center mb-3"><svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg></div>
        <div class="text-2xl md:text-3xl font-bold text-gray-800" id="statTotal">-</div>
        <div class="text-xs text-gray-400 mt-1">签名任务总数</div>
      </div>
      <div class="bg-white rounded-3xl shadow-xl shadow-gray-200/50 p-5 md:p-6">
        <div class="w-10 h-10 rounded-full bg-emerald-500/10 flex items-center justify-center mb-3"><svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg></div>
        <div class="text-2xl md:text-3xl font-bold text-gray-800" id="statDone">-</div>
        <div class="text-xs text-gray-400 mt-1">已完成</div>
      </div>
      <div class="bg-white rounded-3xl shadow-xl shadow-gray-200/50 p-5 md:p-6">
        <div class="w-10 h-10 rounded-full bg-red-500/10 flex items-center justify-center mb-3"><svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></div>
        <div class="text-2xl md:text-3xl font-bold text-gray-800" id="statFailed">-</div>
        <div class="text-xs text-gray-400 mt-1">失败</div>
      </div>
      <div class="bg-white rounded-3xl shadow-xl shadow-gray-200/50 p-5 md:p-6">
        <div class="w-10 h-10 rounded-full bg-amber-500/10 flex items-center justify-center mb-3"><svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg></div>
        <div class="text-2xl md:text-3xl font-bold text-gray-800" id="statDevices">-</div>
        <div class="text-xs text-gray-400 mt-1">注册设备</div>
      </div>
    </div>

    <div class="flex gap-2 mb-6 bg-white rounded-2xl p-2 shadow-lg shadow-gray-200/50 overflow-x-auto">
      <button class="tab-btn px-5 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 bg-indigo-600 text-white shadow-md shadow-indigo-600/30" onclick="switchTab('tasks', this)">签名任务</button>
      <button class="tab-btn px-5 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 text-gray-500 hover:bg-gray-100" onclick="switchTab('devices', this)">设备管理</button>
    </div>

    <div id="panelTasks" class="bg-white rounded-3xl shadow-xl shadow-gray-200/50 p-6 md:p-8">
      <div class="flex items-center justify-between mb-6">
        <h3 class="font-semibold text-lg md:text-xl text-gray-800">签名任务记录</h3>
        <button onclick="loadTasks()" class="px-4 py-2 rounded-xl text-sm font-medium bg-gray-100 text-gray-600 hover:bg-gray-200 transition-colors">刷新</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="text-left text-gray-400 text-xs border-b border-gray-100">
            <th class="pb-3 font-medium">ID</th><th class="pb-3 font-medium">任务ID</th><th class="pb-3 font-medium">状态</th><th class="pb-3 font-medium hidden md:table-cell">P12文件</th><th class="pb-3 font-medium hidden md:table-cell">创建时间</th><th class="pb-3 font-medium">操作</th>
          </tr></thead>
          <tbody id="tasksBody"></tbody>
        </table>
      </div>
    </div>

    <div id="panelDevices" class="hidden bg-white rounded-3xl shadow-xl shadow-gray-200/50 p-6 md:p-8">
      <div class="flex items-center justify-between mb-6">
        <h3 class="font-semibold text-lg md:text-xl text-gray-800">注册设备列表</h3>
        <button onclick="loadDevices()" class="px-4 py-2 rounded-xl text-sm font-medium bg-gray-100 text-gray-600 hover:bg-gray-200 transition-colors">刷新</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="text-left text-gray-400 text-xs border-b border-gray-100">
            <th class="pb-3 font-medium">ID</th><th class="pb-3 font-medium">UDID</th><th class="pb-3 font-medium hidden md:table-cell">产品</th><th class="pb-3 font-medium hidden md:table-cell">型号</th><th class="pb-3 font-medium">注册时间</th>
          </tr></thead>
          <tbody id="devicesBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 px-5 py-3 rounded-2xl text-white text-sm shadow-xl z-50 opacity-0 transition-opacity duration-300 pointer-events-none max-w-xs text-center"></div>

<script>
  let adminPassword = '';

  function showToast(msg, type = 'info') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `fixed top-6 left-1/2 -translate-x-1/2 px-5 py-3 rounded-2xl text-white text-sm shadow-xl z-50 opacity-100 transition-opacity duration-300 pointer-events-none max-w-xs text-center ${type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-gray-800'}`;
    setTimeout(() => t.classList.replace('opacity-100', 'opacity-0'), 2500);
  }

  async function login() {
    const pwd = document.getElementById('passwordInput').value;
    if (!pwd) return showToast('请输入密码', 'error');
    try {
      const res = await fetch(`/api/admin/stats?password=${encodeURIComponent(pwd)}`);
      const data = await res.json();
      if (data.success) {
        adminPassword = pwd;
        sessionStorage.setItem('admin_pwd', pwd);
        document.getElementById('loginWrap').classList.add('hidden');
        document.getElementById('adminLayout').classList.remove('hidden');
        loadAll();
      } else showToast(data.message || '密码错误', 'error');
    } catch(e) { showToast('连接失败，请确认服务已启动', 'error'); }
  }

  function logout() {
    adminPassword = '';
    sessionStorage.removeItem('admin_pwd');
    document.getElementById('adminLayout').classList.add('hidden');
    document.getElementById('loginWrap').classList.remove('hidden');
    document.getElementById('passwordInput').value = '';
  }

  window.addEventListener('DOMContentLoaded', () => {
    const saved = sessionStorage.getItem('admin_pwd');
    if (saved) { adminPassword = saved; document.getElementById('loginWrap').classList.add('hidden'); document.getElementById('adminLayout').classList.remove('hidden'); loadAll(); }
  });

  async function loadAll() { loadStats(); loadTasks(); loadDevices(); }

  async function loadStats() {
    try {
      const res = await fetch(`/api/admin/stats?password=${encodeURIComponent(adminPassword)}`);
      const data = await res.json();
      if (data.success) {
        const s = data.stats;
        document.getElementById('statTotal').textContent = s.totalTasks;
        document.getElementById('statDone').textContent = s.doneTasks;
        document.getElementById('statFailed').textContent = s.failedTasks;
        document.getElementById('statDevices').textContent = s.devices;
      }
    } catch(e) { console.error(e); }
  }

  function switchTab(name, btn) {
    document.querySelectorAll('.tab-btn').forEach(t => { t.classList.remove('bg-indigo-600', 'text-white', 'shadow-md', 'shadow-indigo-600/30'); t.classList.add('text-gray-500', 'hover:bg-gray-100'); });
    btn.classList.add('bg-indigo-600', 'text-white', 'shadow-md', 'shadow-indigo-600/30');
    btn.classList.remove('text-gray-500', 'hover:bg-gray-100');
    document.getElementById('panelTasks').classList.toggle('hidden', name !== 'tasks');
    document.getElementById('panelDevices').classList.toggle('hidden', name !== 'devices');
  }

  function statusBadge(status) {
    const map = {
      pending: { text: '等待中', cls: 'bg-amber-100 text-amber-700' },
      processing: { text: '处理中', cls: 'bg-indigo-100 text-indigo-700' },
      done: { text: '已完成', cls: 'bg-emerald-100 text-emerald-700' },
      failed: { text: '失败', cls: 'bg-red-100 text-red-700' }
    };
    const s = map[status] || { text: status, cls: 'bg-gray-100 text-gray-600' };
    return `<span class="px-2.5 py-1 rounded-full text-xs font-medium ${s.cls}">${s.text}</span>`;
  }

  async function loadTasks() {
    try {
      const res = await fetch(`/api/admin/tasks?password=${encodeURIComponent(adminPassword)}`);
      const data = await res.json();
      const tbody = document.getElementById('tasksBody');
      if (data.success && data.tasks.length > 0) {
        tbody.innerHTML = data.tasks.map(t => `
          <tr class="border-b border-gray-50 hover:bg-gray-50/50 transition-colors">
            <td class="py-3.5 text-gray-600">${t.id}</td>
            <td class="py-3.5 font-mono text-xs text-gray-500">${t.task_id.substring(0,12)}...</td>
            <td class="py-3.5">${statusBadge(t.status)}</td>
            <td class="py-3.5 text-xs text-gray-400 hidden md:table-cell">${t.p12_file || '-'}</td>
            <td class="py-3.5 text-xs text-gray-400 hidden md:table-cell">${t.created_at}</td>
            <td class="py-3.5">
              ${t.status === 'done' ? `<a href="/api/sign/download/${t.task_id}" class="text-indigo-600 hover:text-indigo-700 text-xs font-medium mr-3">下载</a>` : ''}
              <button onclick="deleteTask(${t.id})" class="text-red-500 hover:text-red-600 text-xs font-medium">删除</button>
            </td>
          </tr>
        `).join('');
      } else tbody.innerHTML = '<tr><td colspan="6" class="py-10 text-center text-gray-400 text-sm">暂无签名任务</td></tr>';
    } catch(e) { console.error(e); }
  }

  async function deleteTask(id) {
    if (!confirm('确定删除此任务？')) return;
    try {
      const res = await fetch(`/api/admin/tasks/${id}?password=${encodeURIComponent(adminPassword)}`, { method: 'DELETE' });
      const data = await res.json();
      if (data.success) { showToast('删除成功', 'success'); loadTasks(); loadStats(); }
      else showToast(data.message, 'error');
    } catch(e) { showToast('删除失败', 'error'); }
  }

  async function loadDevices() {
    try {
      const res = await fetch(`/api/admin/devices?password=${encodeURIComponent(adminPassword)}`);
      const data = await res.json();
      const tbody = document.getElementById('devicesBody');
      if (data.success && data.devices.length > 0) {
        tbody.innerHTML = data.devices.map(d => `
          <tr class="border-b border-gray-50 hover:bg-gray-50/50 transition-colors">
            <td class="py-3.5 text-gray-600">${d.id}</td>
            <td class="py-3.5 font-mono text-xs text-gray-500">${d.udid}</td>
            <td class="py-3.5 text-xs text-gray-400 hidden md:table-cell">${d.product || '-'}</td>
            <td class="py-3.5 text-xs text-gray-400 hidden md:table-cell">${d.model || '-'}</td>
            <td class="py-3.5 text-xs text-gray-400">${d.created_at}</td>
          </tr>
        `).join('');
      } else tbody.innerHTML = '<tr><td colspan="5" class="py-10 text-center text-gray-400 text-sm">暂无注册设备</td></tr>';
    } catch(e) { console.error(e); }
  }
</script>

</body>
</html>
