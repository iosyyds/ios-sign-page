<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 - iOS签名工具</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #333; min-height: 100vh; }
  .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-box { background: #fff; border-radius: 12px; padding: 40px; width: 90%; max-width: 380px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
  .login-box h2 { text-align: center; margin-bottom: 8px; font-size: 22px; }
  .login-box p { text-align: center; color: #999; font-size: 13px; margin-bottom: 28px; }
  .login-box input { width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; margin-bottom: 16px; }
  .login-box input:focus { border-color: #2196f3; }
  .login-box button { width: 100%; padding: 12px; background: #1a1a1a; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; transition: background 0.2s; }
  .login-box button:hover { background: #333; }
  .admin-layout { display: none; }
  .admin-layout.show { display: block; }
  .topbar { background: #1a1a1a; color: #fff; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .topbar .title { font-size: 16px; font-weight: 600; }
  .topbar .actions { display: flex; align-items: center; gap: 16px; }
  .topbar a { color: #bbb; text-decoration: none; font-size: 13px; }
  .topbar a:hover { color: #fff; }
  .topbar button { background: transparent; color: #bbb; border: 1px solid #555; padding: 5px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  .topbar button:hover { color: #fff; border-color: #888; }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .stat-card .label { font-size: 13px; color: #888; margin-bottom: 8px; }
  .stat-card .value { font-size: 28px; font-weight: 700; color: #1a1a1a; }
  .stat-card .sub { font-size: 12px; color: #aaa; margin-top: 4px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; background: #fff; border-radius: 8px; padding: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); overflow-x: auto; }
  .tab { padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; color: #666; white-space: nowrap; transition: all 0.2s; border: none; background: transparent; }
  .tab:hover { background: #f5f5f5; }
  .tab.active { background: #1a1a1a; color: #fff; }
  .panel { background: #fff; border-radius: 10px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); display: none; }
  .panel.show { display: block; }
  .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .panel-header h3 { font-size: 17px; }
  .panel-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .panel-actions input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; outline: none; width: 100px; }
  .panel-actions input:focus { border-color: #2196f3; }
  .btn { padding: 8px 18px; border-radius: 6px; font-size: 13px; cursor: pointer; border: none; transition: all 0.2s; }
  .btn-primary { background: #1a1a1a; color: #fff; }
  .btn-primary:hover { background: #333; }
  .btn-danger { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
  .btn-danger:hover { background: #fee2e2; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 12px; background: #fafafa; color: #666; font-weight: 600; border-bottom: 2px solid #eee; white-space: nowrap; }
  td { padding: 12px; border-bottom: 1px solid #f0f0f0; color: #444; }
  tr:hover td { background: #fafafa; }
  .mono { font-family: monospace; font-size: 12px; word-break: break-all; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: 500; }
  .badge.unused { background: #e8f5e9; color: #2e7d32; }
  .badge.used { background: #ffebee; color: #c62828; }
  .badge.pending { background: #fff3e0; color: #e65100; }
  .badge.processing { background: #e3f2fd; color: #1565c0; }
  .badge.done { background: #e8f5e9; color: #2e7d32; }
  .badge.failed { background: #ffebee; color: #c62828; }
  .empty { text-align: center; padding: 40px; color: #999; font-size: 14px; }
  .generated-codes { margin-top: 16px; background: #f9f9f9; border-radius: 8px; padding: 16px; max-height: 300px; overflow-y: auto; }
  .generated-codes .code-item { font-family: monospace; font-size: 13px; padding: 6px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
  .generated-codes .code-item:last-child { border-bottom: none; }
  .copy-btn { background: none; border: none; color: #2196f3; cursor: pointer; font-size: 12px; padding: 0 4px; }
  .toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 6px; font-size: 13px; z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.success { background: rgba(46,125,50,0.9); }
  .toast.error { background: rgba(211,47,47,0.9); }
  .loading { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 768px) { .container { padding: 12px; } .panel { padding: 16px; } .stats-grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <h2>iOS签名工具</h2>
    <p>管理后台登录</p>
    <input type="password" id="passwordInput" placeholder="请输入管理员密码" onkeypress="if(event.key==='Enter')login()">
    <button onclick="login()">登 录</button>
  </div>
</div>

<div class="admin-layout" id="adminLayout">
  <div class="topbar">
    <div class="title">iOS签名工具 · 管理后台</div>
    <div class="actions">
      <a href="/" target="_blank">返回前台</a>
      <button onclick="logout()">退出登录</button>
    </div>
  </div>
  <div class="container">
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="label">设备总数</div><div class="value" id="statDevices">-</div></div>
      <div class="stat-card"><div class="label">兑换码总数</div><div class="value" id="statCodesTotal">-</div></div>
      <div class="stat-card"><div class="label">已使用</div><div class="value" id="statCodesUsed">-</div><div class="sub">未使用: <span id="statCodesUnused">-</span></div></div>
      <div class="stat-card"><div class="label">安装记录</div><div class="value" id="statRecords">-</div></div>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('devices')">设备管理</button>
      <button class="tab" onclick="switchTab('codes')">兑换码管理</button>
      <button class="tab" onclick="switchTab('records')">安装记录</button>
      <button class="tab" onclick="switchTab('certs')">证书管理</button>
    </div>
    <div class="panel show" id="panelDevices">
      <div class="panel-header"><h3>设备列表</h3><button class="btn btn-primary" onclick="loadDevices()">刷新</button></div>
      <div class="table-wrap"><table><thead><tr><th>ID</th><th>UDID</th><th>产品</th><th>型号</th><th>系统版本</th><th>注册时间</th></tr></thead><tbody id="devicesBody"></tbody></table></div>
    </div>
    <div class="panel" id="panelCodes">
      <div class="panel-header">
        <h3>兑换码管理</h3>
        <div class="panel-actions">
          <input type="number" id="genCount" value="1" min="1" max="100" title="生成数量">
          <input type="text" id="genPrefix" placeholder="前缀(选填)" style="width:120px;">
          <button class="btn btn-primary" id="genBtn" onclick="generateCodes()">生成兑换码</button>
        </div>
      </div>
      <div class="generated-codes" id="generatedCodes" style="display:none;"></div>
      <div class="table-wrap" style="margin-top:16px;"><table><thead><tr><th>ID</th><th>兑换码</th><th>状态</th><th>使用设备</th><th>生成时间</th><th>使用时间</th><th>操作</th></tr></thead><tbody id="codesBody"></tbody></table></div>
    </div>
    <div class="panel" id="panelRecords">
      <div class="panel-header"><h3>安装记录（最近200条）</h3><button class="btn btn-primary" onclick="loadRecords()">刷新</button></div>
      <div class="table-wrap"><table><thead><tr><th>ID</th><th>UDID</th><th>应用名称</th><th>兑换码</th><th>状态</th><th>时间</th></tr></thead><tbody id="recordsBody"></tbody></table></div>
    </div>
    <div class="panel" id="panelCerts">
      <div class="panel-header"><h3>上传的证书</h3><button class="btn btn-primary" onclick="loadCerts()">刷新</button></div>
      <div class="table-wrap"><table><thead><tr><th>ID</th><th>UDID</th><th>证书名称</th><th>P12文件</th><th>描述文件</th><th>上传时间</th></tr></thead><tbody id="certsBody"></tbody></table></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
  const API = '';
  let adminPassword = '';
  function showToast(msg, type = '') { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show ' + type; setTimeout(() => t.classList.remove('show'), 2500); }
  function authHeaders() { return { 'Content-Type': 'application/json', 'X-Admin-Password': adminPassword }; }

  async function login() {
    const pwd = document.getElementById('passwordInput').value;
    if (!pwd) return showToast('请输入密码', 'error');
    try {
      const res = await fetch(`${API}/api/admin/stats?password=${encodeURIComponent(pwd)}`);
      const data = await res.json();
      if (data.success) {
        adminPassword = pwd;
        sessionStorage.setItem('admin_pwd', pwd);
        document.getElementById('loginWrap').style.display = 'none';
        document.getElementById('adminLayout').classList.add('show');
        loadAll();
      } else showToast(data.message || '密码错误', 'error');
    } catch(e) { showToast('连接失败，请确认服务已启动', 'error'); }
  }

  function logout() {
    adminPassword = '';
    sessionStorage.removeItem('admin_pwd');
    document.getElementById('adminLayout').classList.remove('show');
    document.getElementById('loginWrap').style.display = 'flex';
    document.getElementById('passwordInput').value = '';
  }

  window.addEventListener('DOMContentLoaded', () => {
    const saved = sessionStorage.getItem('admin_pwd');
    if (saved) { adminPassword = saved; document.getElementById('loginWrap').style.display = 'none'; document.getElementById('adminLayout').classList.add('show'); loadAll(); }
  });

  async function loadAll() { loadStats(); loadDevices(); loadCodes(); loadRecords(); loadCerts(); }

  async function loadStats() {
    try {
      const res = await fetch(`${API}/api/admin/stats?password=${encodeURIComponent(adminPassword)}`);
      const data = await res.json();
      if (data.success) {
        const s = data.stats;
        document.getElementById('statDevices').textContent = s.devices;
        document.getElementById('statCodesTotal').textContent = s.codesTotal;
        document.getElementById('statCodesUsed').textContent = s.codesUsed;
        document.getElementById('statCodesUnused').textContent = s.codesUnused;
        document.getElementById('statRecords').textContent = s.records;
      }
    } catch(e) { console.error(e); }
  }

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('show'));
    event.target.classList.add('active');
    document.getElementById('panel' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('show');
  }

  async function loadDevices() {
    try {
      const res = await fetch(`${API}/api/admin/devices?password=${encodeURIComponent(adminPassword)}`);
      const data = await res.json();
      const tbody = document.getElementById('devicesBody');
      if (data.success && data.devices.length > 0) {
        tbody.innerHTML = data.devices.map(d => `<tr><td>${d.id}</td><td class="mono">${d.udid}</td><td>${d.product || '-'}</td><td>${d.model || '-'}</td><td>${d.version || '-'}</td><td>${d.created_at}</td></tr>`).join('');
      } else tbody.innerHTML = '<tr><td colspan="6" class="empty">暂无设备</td></tr>';
    } catch(e) { console.error(e); }
  }

  async function loadCodes() {
    try {
      const res = await fetch(`${API}/api/admin/codes?password=${encodeURIComponent(adminPassword)}`);
      const data = await res.json();
      const tbody = document.getElementById('codesBody');
      if (data.success && data.codes.length > 0) {
        tbody.innerHTML = data.codes.map(c => `<tr><td>${c.id}</td><td class="mono"><strong>${c.code}</strong></td><td><span class="badge ${c.status === 1 ? 'used' : 'unused'}">${c.status === 1 ? '已使用' : '未使用'}</span></td><td class="mono">${c.used_udid || '-'}</td><td>${c.created_at}</td><td>${c.used_at || '-'}</td><td>${c.status === 0 ? `<button class="btn btn-danger" onclick="deleteCode(${c.id})">删除</button>` : '-'}</td></tr>`).join('');
      } else tbody.innerHTML = '<tr><td colspan="7" class="empty">暂无兑换码，点击上方按钮生成</td></tr>';
    } catch(e) { console.error(e); }
  }

  async function generateCodes() {
    const count = parseInt(document.getElementById('genCount').value) || 1;
    const prefix = document.getElementById('genPrefix').value.trim();
    const btn = document.getElementById('genBtn');
    btn.disabled = true; btn.innerHTML = '<span class="loading"></span> 生成中...';
    try {
      const res = await fetch(`${API}/api/admin/codes?password=${encodeURIComponent(adminPassword)}`, { method: 'POST', headers: authHeaders(), body: JSON.stringify({ count, prefix }) });
      const data = await res.json();
      if (data.success) {
        showToast(data.message, 'success');
        const box = document.getElementById('generatedCodes');
        box.style.display = 'block';
        box.innerHTML = '<div style="font-size:13px;color:#666;margin-bottom:8px;">新生成的兑换码（点击复制）：</div>' + data.codes.map(c => `<div class="code-item"><span>${c}</span><button class="copy-btn" onclick="copyCode('${c}',this)">复制</button></div>`).join('');
        loadCodes(); loadStats();
      } else showToast(data.message, 'error');
    } catch(e) { showToast('生成失败', 'error'); }
    finally { btn.disabled = false; btn.textContent = '生成兑换码'; }
  }

  function copyCode(code, btn) {
    navigator.clipboard.writeText(code).then(() => { btn.textContent = '已复制'; setTimeout(() => btn.textContent = '复制', 1500); });
  }

  async function deleteCode(id) {
    if (!confirm('确定删除此兑换码？')) return;
    try {
      const res = await fetch(`${API}/api/admin/codes/${id}?password=${encodeURIComponent(adminPassword)}`, { method: 'DELETE' });
      const data = await res.json();
      if (data.success) { showToast('删除成功', 'success'); loadCodes(); loadStats(); }
      else showToast(data.message, 'error');
    } catch(e) { showToast('删除失败', 'error'); }
  }

  async function loadRecords() {
    try {
      const res = await fetch(`${API}/api/admin/records?password=${encodeURIComponent(adminPassword)}`);
      const data = await res.json();
      const tbody = document.getElementById('recordsBody');
      if (data.success && data.records.length > 0) {
        tbody.innerHTML = data.records.map(r => `<tr><td>${r.id}</td><td class="mono">${r.udid}</td><td>${r.app_name || '-'}</td><td class="mono">${r.code || '-'}</td><td><span class="badge ${r.status}">${statusText(r.status)}</span></td><td>${r.created_at}</td></tr>`).join('');
      } else tbody.innerHTML = '<tr><td colspan="6" class="empty">暂无安装记录</td></tr>';
    } catch(e) { console.error(e); }
  }

  function statusText(s) { const map = { pending: '等待中', processing: '处理中', done: '已完成', failed: '失败' }; return map[s] || s; }

  async function loadCerts() {
    try {
      const res = await fetch(`${API}/api/admin/certificates?password=${encodeURIComponent(adminPassword)}`);
      const data = await res.json();
      const tbody = document.getElementById('certsBody');
      if (data.success && data.certificates.length > 0) {
        tbody.innerHTML = data.certificates.map(c => `<tr><td>${c.id}</td><td class="mono">${c.udid}</td><td>${c.cert_name || '-'}</td><td class="mono">${c.p12_file || '-'}</td><td class="mono">${c.mp_file || '-'}</td><td>${c.created_at}</td></tr>`).join('');
      } else tbody.innerHTML = '<tr><td colspan="6" class="empty">暂无上传证书</td></tr>';
    } catch(e) { console.error(e); }
  }
</script>
</body>
</html>
