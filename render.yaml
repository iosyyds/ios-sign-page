# Render 一键部署配置
# 使用方法：在 Render  Dashboard 中选择 "New +" -> "Web Service"，连接本仓库即可自动部署
# 免费套餐：Free（15分钟无请求会休眠，下次访问需等待约30秒）

services:
  - type: web
    name: ios-sign-server
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: PORT
        value: 3000
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
