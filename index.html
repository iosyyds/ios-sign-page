<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全能签官方客户端</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f0f2f5;
    color: #333;
    min-height: 100vh;
  }
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
  }
  .header {
    background: #fff;
    border-radius: 8px;
    padding: 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .logo {
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, #e53935, #b71c1c);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .logo svg { width: 32px; height: 32px; }
  .header-info h1 {
    font-size: 20px;
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 4px;
  }
  .header-info h1 .sep { color: #999; margin: 0 6px; font-weight: 400; }
  .header-info h1 .sub { color: #1a1a1a; font-weight: 600; }
  .header-info p {
    font-size: 13px;
    color: #888;
    line-height: 1.5;
  }
  .main-card {
    background: #fff;
    border-radius: 8px;
    padding: 40px 32px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    position: relative;
  }
  .install-btn-wrap {
    text-align: center;
    margin-bottom: 28px;
  }
  .btn-install {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #1a1a1a;
    color: #fff;
    border: none;
    padding: 12px 32px;
    border-radius: 24px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-install:hover { background: #333; transform: translateY(-1px); }
  .btn-install .divider { color: #666; margin: 0 4px; }
  .btn-install .pro { color: #bbb; }
  .steps-bar {
    background: #e8f4fd;
    border-radius: 6px;
    padding: 14px 20px;
    text-align: center;
    margin-bottom: 24px;
    font-size: 14px;
  }
  .steps-bar .label { color: #333; font-weight: 500; }
  .steps-bar .step1 { color: #d32f2f; font-weight: 600; }
  .steps-bar .step2 { color: #d32f2f; font-weight: 600; }
  .action-btns {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .btn-action {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #f5f5f5;
    color: #555;
    border: 1px solid #ddd;
    padding: 6px 16px;
    border-radius: 16px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-action:hover { background: #e8e8e8; border-color: #ccc; }
  .btn-action .star { color: #888; }
  .input-section {
    margin-bottom: 24px;
  }
  .udid-input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .udid-input:focus { border-color: #2196f3; box-shadow: 0 0 0 2px rgba(33,150,243,0.15); }
  .udid-input::placeholder { color: #aaa; }
  .self-install-wrap {
    text-align: center;
    margin-bottom: 32px;
  }
  .btn-self {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    color: #1a1a1a;
    border: 2px solid #1a1a1a;
    padding: 10px 28px;
    border-radius: 22px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-self:hover { background: #1a1a1a; color: #fff; }
  .btn-self .divider { color: #999; }
  .btn-self:hover .divider { color: #666; }
  .footer {
    text-align: center;
    padding: 20px 0;
    font-size: 12px;
    color: #999;
    line-height: 1.8;
  }
  .footer a { color: #2196f3; text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
  .float-menu {
    position: fixed;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 100;
  }
  .float-item {
    background: #f5f5f5;
    border: 1px solid #e0e0e0;
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 12px;
    color: #666;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .float-item:hover { background: #e8f4fd; color: #2196f3; border-color: #2196f3; }
  .float-item .arrow { color: #bbb; font-size: 10px; }
  .float-item.active { background: #e8f4fd; color: #d32f2f; border-color: #d32f2f; }
  .toast {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 12px 24px;
    border-radius: 6px;
    font-size: 14px;
    z-index: 9999;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
  @media (max-width: 768px) {
    .container { padding: 10px; }
    .header { padding: 16px; flex-direction: column; text-align: center; }
    .main-card { padding: 24px 16px; }
    .float-menu { display: none; }
    .action-btns { gap: 8px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z" fill="#fff"/>
        <path d="M20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="#fff"/>
      </svg>
    </div>
    <div class="header-info">
      <h1>全能签<span class="sep">|</span><span class="sub">iOS签名工具</span></h1>
      <p>简介：全能签是一款iOS免费的签名工具，可签名安装未上架 App Store 内测应用程序，严禁签名外挂和违规应用。</p>
    </div>
  </div>
  <div class="main-card">
    <div class="install-btn-wrap">
      <button class="btn-install" onclick="handleInstall()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        立即安装
        <span class="divider">|</span>
        <span class="pro">专业版</span>
      </button>
    </div>
    <div class="steps-bar">
      <span class="label">安装步骤：</span>
      <span class="step1">第一步【获取设备UDID】</span>
      <br>
      <span class="step2">第二步【输入兑换码】</span>
    </div>
    <div class="action-btns">
      <button class="btn-action" onclick="handleGetUDID()">获取UDID</button>
      <button class="btn-action" onclick="handleBuyCode()">
        <span class="star">★</span>购买证书兑换码<span class="star">★</span>
      </button>
      <button class="btn-action" onclick="handleHistory()">历史查询</button>
    </div>
    <div class="input-section">
      <input type="text" class="udid-input" id="udidInput" placeholder="请输入安装的设备UDID" maxlength="40">
    </div>
    <div class="self-install-wrap">
      <button class="btn-self" onclick="handleSelfInstall()">
        我有证书<span class="divider">|</span>自助安装
      </button>
    </div>
    <div class="footer">
      <div><a href="javascript:void(0)">无锡诺思客信息技术有限公司</a></div>
      <div>备案号：苏ICP备19018114号-1</div>
      <div>APP备：苏ICP备19018114号-3A</div>
      <div>苏公网安备32020602001498</div>
    </div>
  </div>
</div>
<div class="float-menu">
  <div class="float-item" onclick="showToast('返回全能签官网')"><span class="arrow">▸</span>返回全能签官网</div>
  <div class="float-item" onclick="showToast('视频安装教程')"><span class="arrow">▸</span>视频安装教程</div>
  <div class="float-item" onclick="showToast('联系客服')"><span class="arrow">▸</span>联系客服</div>
  <div class="float-item active" onclick="showToast('苹果开发者模式')"><span class="arrow">▸</span>苹果开发者模式</div>
</div>
<div class="toast" id="toast"></div>
<script>
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }
  function handleInstall() {
    const udid = document.getElementById('udidInput').value.trim();
    if (!udid) { showToast('请先输入设备UDID'); return; }
    showToast('正在准备安装，请稍候...');
  }
  function handleGetUDID() { showToast('请使用Safari浏览器打开描述文件获取UDID'); }
  function handleBuyCode() { showToast('即将跳转到购买页面...'); }
  function handleHistory() { showToast('请输入UDID查询安装记录'); }
  function handleSelfInstall() {
    const udid = document.getElementById('udidInput').value.trim();
    if (!udid) { showToast('请先输入设备UDID'); return; }
    showToast('正在进入自助安装流程...');
  }
  document.getElementById('udidInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') handleInstall();
  });
</script>
</body>
</html>
